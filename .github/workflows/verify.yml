name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.reuse.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          WF_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          wf="${WF_REF%@*}"; wf="${wf##*/}"
          # Evidence is only a push run of this workflow from this repository, never this run: a pull request
          # tests its merge ref, a dispatch may run a subset, and a PR run of this workflow may itself be a skip.
          # Prints "<status> <conclusion>" of the newest such run on SHA $1, or nothing (any API error: nothing).
          newest_push() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$1&event=push&per_page=100" \
              --jq "[.workflow_runs[] | select(.head_repository.full_name == \"$GITHUB_REPOSITORY\" and .id != $GITHUB_RUN_ID)] | max_by(.id) | select(. != null) | \"\(.status) \(.conclusion)\"" || true
          }
          green() { [ "$(newest_push "$1")" = "completed success" ]; }
          skip=false
          # C1: main push of a SHA whose newest push run of this workflow (a branch run) is green.
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ] && green "$GITHUB_SHA"; then skip=true; fi
          # C3 (exact): same tree as the parent, and the parent's newest push run is green (e.g. an empty commit).
          if [ "$skip" = false ] && [ "$EVENT" = push ] && parent=$(git rev-parse -q --verify HEAD~1) \
             && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD~1^{tree}')" ] && green "$parent"; then skip=true; fi
          # C2: same-repository PR. The lander takes any green same-repo run on the exact SHA as evidence,
          # pull_request runs included, so this run may pass without shards only when the push run on the
          # PR head is green: wait for it (at most 25 minutes).
          # No push run, any other result, or the wait running out: run in full.
          if [ "$EVENT" = pull_request ] && [ "$SAME_REPO" = true ]; then
            for _ in $(seq 1 50); do
              state=$(newest_push "$PR_HEAD")
              case "$state" in
                'completed success') skip=true; break ;;
                ''|completed\ *) break ;;
                *) sleep 30 ;;
              esac
            done
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reclaim unused hosted-runner SDKs
        if: ${{ runner.environment == 'github-hosted' && runner.os == 'Linux' }}
        run: bash scripts/ci/reclaim-disk.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer check --profile first-party
      - name: Check edition source lock freshness
        run: node scripts/edition-authoring/cli.mjs check
      - run: node scripts/edition-authoring/cli.mjs verify-base --offline
      - run: node scripts/edition-authoring/cli.mjs verify-base --record migrations/base-copies.json --offline
      # rer build invokes build:app (vite build) once, retaining its output guards.
      - run: pnpm run build
      - run: pnpm run typecheck
      - name: Pack shared build without runtime state
        run: tar -cf "$RUNNER_TEMP/willow-build.tar" dist .wrangler/deploy/config.json
      - uses: actions/upload-artifact@v4
        with:
          name: willow-build
          path: ${{ runner.temp }}/willow-build.tar
          retention-days: 1

  shards:
    name: verify (${{ matrix.shard }})
    needs: [plan, build]
    if: needs.plan.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Before-run test seconds, excluding repeated setup/build:
          # 517, 520, 581, 574, 525, 533, 520. Commands run separately (651).
          - shard: core
            browser: full
            current-browser: false
            disk: true
          - shard: policy-sections
            browser: full
            current-browser: true
            disk: true
          - shard: people-scope-pay
            browser: full
            current-browser: true
            disk: true
          - shard: restore-api-approvals
            browser: none
            current-browser: true
            disk: true
          - shard: access-signing-job
            browser: shell
            current-browser: true
            disk: false
          - shard: work-credentials-leave
            browser: full
            current-browser: true
            disk: true
          - shard: retention-performance-phase2
            browser: full
            current-browser: false
            disk: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Set external evidence directory
        run: printf 'WILLOW_EVIDENCE_DIR=%s/willow-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reclaim unused hosted-runner SDKs
        if: ${{ matrix.disk && runner.environment == 'github-hosted' && runner.os == 'Linux' }}
        run: bash scripts/ci/reclaim-disk.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: willow-build
          path: ${{ runner.temp }}/willow-build
      - name: Install Chromium
        if: matrix.browser != 'none'
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          set -euo pipefail
          if [ "$BROWSER" = shell ]; then
            pnpm exec playwright install --only-shell chromium
          else
            pnpm exec playwright install chromium
          fi
          # Hosted ubuntu-24.04 already carries Chromium's libraries. Use apt only when a real launch fails.
          node scripts/ci/chromium-probe.mjs || {
            timeout 420 pnpm exec playwright install-deps chromium
            node scripts/ci/chromium-probe.mjs
          }
      - name: Install current signing and section browser
        if: matrix.current-browser
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/willow-playwright" --no-save playwright@1.64.1
          export WILLOW_PLAYWRIGHT_PATH="$RUNNER_TEMP/willow-playwright/node_modules/playwright/index.mjs"
          node "$RUNNER_TEMP/willow-playwright/node_modules/playwright/cli.js" install --only-shell chromium
          node scripts/ci/chromium-probe.mjs || {
            timeout 420 node "$RUNNER_TEMP/willow-playwright/node_modules/playwright/cli.js" install-deps chromium
            node scripts/ci/chromium-probe.mjs
          }
      - name: Unpack shared build
        id: shared-build
        run: tar -xf "$RUNNER_TEMP/willow-build/willow-build.tar"
      - name: Verify core
        if: ${{ !cancelled() && steps.shared-build.outcome == 'success' && matrix.shard == 'core' }}
        env:
          WILLOW_VERIFY_SHARD: 'core'
          WILLOW_CI_BUILT: '1'
        run: pnpm exec rer verify
      - name: Verify records-policy
        if: ${{ !cancelled() && steps.shared-build.outcome == 'success' && matrix.shard == 'policy-sections' }}
        env:
          WILLOW_VERIFY_SHARD: 'records-policy'
          WILLOW_CI_BUILT: '1'
        run: pnpm exec rer verify
      - name: Verify records-people
        if: ${{ !cancelled() && steps.shared-build.outcome == 'success' && matrix.shard == 'people-scope-pay' }}
        env:
          WILLOW_VERIFY_SHARD: 'records-people'
          WILLOW_CI_BUILT: '1'
        run: pnpm exec rer verify
      - name: Verify records-work
        if: ${{ !cancelled() && steps.shared-build.outcome == 'success' && matrix.shard == 'work-credentials-leave' }}
        env:
          WILLOW_VERIFY_SHARD: 'records-work'
          WILLOW_CI_BUILT: '1'
        run: pnpm exec rer verify
      - name: Run site
        if: ${{ !cancelled() && steps.shared-build.outcome == 'success' && matrix.shard == 'core' }}
        run: pnpm run test:site
      - name: browser-access
        if: ${{ !cancelled() && steps.shared-build.outcome == 'success' && matrix.shard == 'access-signing-job' }}
        env:
          WILLOW_VERIFY_SHARD: 'browser-access'
        run: WILLOW_LEVELS_BROWSER=1 node tests/willow/levels.mjs
      - name: browser-scope
        if: ${{ !cancelled() && steps.shared-build.outcome == 'success' && matrix.shard == 'people-scope-pay' }}
        env:
          WILLOW_VERIFY_SHARD: 'browser-scope'
        run: WILLOW_LEVELS_BROWSER=1 node tests/willow/levels.mjs
      - name: browser-job
        if: ${{ !cancelled() && steps.shared-build.outcome == 'success' && matrix.shard == 'access-signing-job' }}
        env:
          WILLOW_VERIFY_SHARD: 'browser-job'
        run: WILLOW_LEVELS_BROWSER=1 node tests/willow/levels.mjs
      - name: Phase two browser
        if: ${{ !cancelled() && steps.shared-build.outcome == 'success' && matrix.shard == 'retention-performance-phase2' }}
        env:
          WILLOW_VERIFY_SHARD: browser-phase2
        run: pnpm run test:phase2-browser
      - name: AI policy browser
        if: ${{ !cancelled() && steps.shared-build.outcome == 'success' && matrix.shard == 'retention-performance-phase2' }}
        env:
          WILLOW_VERIFY_SHARD: browser-phase2
        run: WILLOW_AI_BROWSER=1 node tests/willow/ai-policy.mjs
      - name: Signing journeys
        if: ${{ !cancelled() && steps.shared-build.outcome == 'success' && matrix.shard == 'access-signing-job' }}
        env:
          WILLOW_CI_BUILT: '1'
          WILLOW_PLAYWRIGHT_PATH: '${{ runner.temp }}/willow-playwright/node_modules/playwright/index.mjs'
        run: sh scripts/willow/signing-journey.sh
      - name: Section journeys (api)
        if: ${{ !cancelled() && steps.shared-build.outcome == 'success' && matrix.shard == 'restore-api-approvals' }}
        env:
          WILLOW_PLAYWRIGHT_PATH: '${{ runner.temp }}/willow-playwright/node_modules/playwright/index.mjs'
        run: WILLOW_LEVELS_BROWSER=1 node tests/willow/levels-sections.mjs apiRoster
      - name: Section journeys (credentials)
        if: ${{ !cancelled() && steps.shared-build.outcome == 'success' && matrix.shard == 'work-credentials-leave' }}
        env:
          WILLOW_PLAYWRIGHT_PATH: '${{ runner.temp }}/willow-playwright/node_modules/playwright/index.mjs'
        run: WILLOW_LEVELS_BROWSER=1 node tests/willow/levels-sections.mjs settingsSelection apiKeys settingsBrowser
      - name: Section journeys (pay)
        if: ${{ !cancelled() && steps.shared-build.outcome == 'success' && matrix.shard == 'people-scope-pay' }}
        env:
          WILLOW_PLAYWRIGHT_PATH: '${{ runner.temp }}/willow-playwright/node_modules/playwright/index.mjs'
        run: WILLOW_LEVELS_BROWSER=1 node tests/willow/levels-sections.mjs pay records definitions
      - name: Section journeys (leave)
        if: ${{ !cancelled() && steps.shared-build.outcome == 'success' && matrix.shard == 'work-credentials-leave' }}
        env:
          WILLOW_PLAYWRIGHT_PATH: '${{ runner.temp }}/willow-playwright/node_modules/playwright/index.mjs'
        run: WILLOW_LEVELS_BROWSER=1 node tests/willow/levels-sections.mjs leave custody browser
      - name: Section journeys (approvals)
        if: ${{ !cancelled() && steps.shared-build.outcome == 'success' && matrix.shard == 'restore-api-approvals' }}
        env:
          WILLOW_PLAYWRIGHT_PATH: '${{ runner.temp }}/willow-playwright/node_modules/playwright/index.mjs'
        run: WILLOW_LEVELS_BROWSER=1 node tests/willow/levels-sections.mjs approvalPersonal approvalRouting approvalBrowser
      - name: Section journeys (builtins)
        if: ${{ !cancelled() && steps.shared-build.outcome == 'success' && matrix.shard == 'policy-sections' }}
        env:
          WILLOW_PLAYWRIGHT_PATH: '${{ runner.temp }}/willow-playwright/node_modules/playwright/index.mjs'
        run: WILLOW_LEVELS_BROWSER=1 node tests/willow/levels-sections.mjs builtinSelection builtinBrowser builtinCustody
      - name: Webhooks browser
        if: ${{ !cancelled() && steps.shared-build.outcome == 'success' && matrix.shard == 'restore-api-approvals' }}
        env:
          WILLOW_PLAYWRIGHT_PATH: '${{ runner.temp }}/willow-playwright/node_modules/playwright/index.mjs'
        run: WILLOW_LEVELS_BROWSER=1 node tests/willow/webhooks.mjs
      - name: Retention and EEO
        if: ${{ !cancelled() && steps.shared-build.outcome == 'success' && matrix.shard == 'retention-performance-phase2' }}
        env:
          WILLOW_EEO_INVITATIONS_BROWSER: '1'
          WILLOW_EEO_BROWSER: '1'
        run: pnpm run test:retention-eeo
      - name: Performance
        if: ${{ !cancelled() && steps.shared-build.outcome == 'success' && matrix.shard == 'retention-performance-phase2' }}
        run: WILLOW_PERFORMANCE_BROWSER=1 node tests/willow/performance.mjs
      - name: Restore erasure
        if: ${{ !cancelled() && steps.shared-build.outcome == 'success' && matrix.shard == 'restore-api-approvals' }}
        run: pnpm run test:restore-erasure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: willow-pages-${{ matrix.shard }}
          path: ${{ runner.temp }}/willow-evidence/*.png

  commands-and-restore:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Set external evidence directory
        run: printf 'WILLOW_EVIDENCE_DIR=%s/willow-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reclaim unused hosted-runner SDKs
        if: ${{ runner.environment == 'github-hosted' && runner.os == 'Linux' }}
        run: bash scripts/ci/reclaim-disk.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: |
          set -euo pipefail
          pnpm exec playwright install chromium
          # Hosted ubuntu-24.04 already carries Chromium's libraries. Use apt only when a real launch fails.
          node scripts/ci/chromium-probe.mjs || {
            timeout 420 pnpm exec playwright install-deps chromium
            node scripts/ci/chromium-probe.mjs
          }
      # The checkout is a fresh clone: the journey runs setup, dev, build,
      # preview, export and import in it through pnpm exec rer.
      - run: pnpm run test:journey
        env:
          WILLOW_TEST_CHECKOUT: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: willow-command-pages
          path: ${{ runner.temp }}/willow-evidence/*.png

  verify:
    needs: [plan, build, shards, commands-and-restore]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require the plan and every shard
        env:
          PLAN: ${{ needs.plan.result }}
          SKIP: ${{ needs.plan.outputs.skip }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          test "$PLAN" = success
          if [ "$SKIP" = true ]; then exit 0; fi
          for result in $RESULTS; do test "$result" = success; done
