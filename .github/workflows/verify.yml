name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: verify (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [core, records-people, records-work, records-policy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      WILLOW_VERIFY_SHARD: ${{ matrix.shard }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Set external evidence directory
        run: printf 'WILLOW_EVIDENCE_DIR=%s/willow-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # rer's servers keep their real 15 GiB free-space guard; Willow uses none of
      # these preinstalled SDKs, so remove them on GitHub's disposable runner.
      - name: Reclaim unused hosted-runner SDKs
        if: ${{ runner.environment == 'github-hosted' && runner.os == 'Linux' }}
        run: |
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer install
      - run: pnpm exec rer check --profile first-party
      - run: pnpm exec rer verify
      - if: matrix.shard == 'core'
        run: pnpm run test:site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: willow-pages-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/willow-evidence/*.png

  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Set external evidence directory
        run: printf 'WILLOW_EVIDENCE_DIR=%s/willow-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer install
      - run: pnpm exec vite build
      - run: pnpm exec playwright install --with-deps chromium
      - run: WILLOW_PERFORMANCE_BROWSER=1 node tests/willow/performance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: willow-performance-pages
          path: ${{ runner.temp }}/willow-evidence/*.png

  commands-and-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Set external evidence directory
        run: printf 'WILLOW_EVIDENCE_DIR=%s/willow-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # rer's servers keep their real 15 GiB free-space guard; Willow uses none of
      # these preinstalled SDKs, so remove them on GitHub's disposable runner.
      - name: Reclaim unused hosted-runner SDKs
        if: ${{ runner.environment == 'github-hosted' && runner.os == 'Linux' }}
        run: |
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer install
      - run: pnpm exec playwright install --with-deps chromium
      # The checkout is a fresh clone: the journey runs setup, dev, build,
      # preview, export and import in it through pnpm exec rer.
      - run: pnpm run test:journey
        env:
          WILLOW_TEST_CHECKOUT: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: willow-command-pages
          path: ${{ runner.temp }}/willow-evidence/*.png

  retention-and-eeo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      WILLOW_EEO_INVITATIONS_BROWSER: '1'
      WILLOW_EEO_BROWSER: '1'
    steps:
      - name: Set external evidence directory
        run: printf 'WILLOW_EVIDENCE_DIR=%s/willow-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer install
      - run: pnpm exec vite build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:retention-eeo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: willow-eeo-pages
          path: ${{ runner.temp }}/willow-evidence/*.png

  restore-erasure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer install
      - run: pnpm exec vite build
      - run: pnpm run test:restore-erasure

  browser-journeys:
    name: browser-journeys (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [browser-access, browser-scope, browser-job, browser-phase2]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      WILLOW_VERIFY_SHARD: ${{ matrix.shard }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Set external evidence directory
        run: printf 'WILLOW_EVIDENCE_DIR=%s/willow-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer install
      - run: pnpm exec vite build
      - run: pnpm exec playwright install --only-shell chromium
      - if: matrix.shard != 'browser-phase2'
        run: WILLOW_LEVELS_BROWSER=1 node tests/willow/levels.mjs
      - if: matrix.shard == 'browser-phase2'
        run: pnpm run test:phase2-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: willow-browser-pages-${{ matrix.shard }}
          path: ${{ runner.temp }}/willow-evidence/*.png

  section-journeys:
    name: section-journeys (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: api
            sections: apiRoster
          - shard: credentials
            sections: settingsSelection apiKeys settingsBrowser
          - shard: pay
            sections: pay records definitions
          - shard: leave
            sections: leave custody browser
          - shard: approvals
            sections: approvalPersonal approvalRouting approvalBrowser
          - shard: builtins
            sections: builtinSelection builtinBrowser builtinCustody
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Set external evidence directory
        run: printf 'WILLOW_EVIDENCE_DIR=%s/willow-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer install
      - run: pnpm exec vite build
      - name: Install current section browser
        run: |
          npm install --prefix "$RUNNER_TEMP/willow-playwright" --no-save playwright@1.64.1
          node "$RUNNER_TEMP/willow-playwright/node_modules/playwright/cli.js" install --only-shell chromium
          printf 'WILLOW_PLAYWRIGHT_PATH=%s/willow-playwright/node_modules/playwright/index.mjs\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: WILLOW_LEVELS_BROWSER=1 node tests/willow/levels-sections.mjs ${{ matrix.sections }}
      - if: matrix.shard == 'api'
        run: node tests/willow/webhooks.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: willow-section-pages-${{ matrix.shard }}
          path: ${{ runner.temp }}/willow-evidence/*.png
